<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith 特戰網址提取助手 v2.0</title>
    <style>
        body { 
            font-family: "Segoe UI", Arial, sans-serif; 
            background-color: #0b0b0b; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .container { 
            background-color: #111111; 
            border: 1px solid #222222; 
            padding: 35px 25px; 
            border-radius: 4px; 
            max-width: 480px; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
        }
        h1 { 
            font-size: 22px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            margin-bottom: 8px; 
            color: #ff4655; 
        }
        .subtitle { 
            color: #aaaaaa; 
            font-size: 13px; 
            margin-bottom: 25px; 
        }
        .input-group { 
            text-align: left; 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            font-size: 13px; 
            color: #cccccc; 
            margin-bottom: 8px; 
            font-weight: 600; 
            line-height: 1.5; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            background-color: #161616; 
            border: 1px solid #333; 
            color: #fff; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 13px; 
        }
        input:focus { 
            border-color: #ff4655; 
            outline: none; 
        }
        .btn { 
            display: block; 
            width: 100%; 
            padding: 12px 0; 
            background-color: #222; 
            color: #00ffcc; 
            font-weight: 700; 
            font-size: 13px; 
            border-radius: 4px; 
            cursor: pointer; 
            border: 1px solid #333; 
            margin-top: 5px; 
        }
        .btn:hover { 
            background-color: #333; 
        }
        .submit-btn { 
            display: block; 
            width: 100%; 
            padding: 12px 0; 
            background-color: #ff4655; 
            color: #fff; 
            font-weight: 700; 
            font-size: 15px; 
            border-radius: 4px; 
            cursor: pointer; 
            border: none; 
            margin-top: 15px; 
        }
        .submit-btn:hover { 
            background-color: #dc3d4b; 
        }
        .result-box { 
            margin-top: 20px; 
            background: #000; 
            padding: 15px; 
            border-radius: 4px; 
            display: none; 
            text-align: left; 
            border: 1px solid #222; 
        }
        .result-title { 
            color: #ff4655; 
            font-size: 13px; 
            font-weight: bold; 
            margin-bottom: 5px; 
        }
        textarea { 
            width: 100%; 
            height: 80px; 
            background: #111; 
            border: 1px solid #222; 
            color: #00ffcc; 
            font-size: 12px; 
            resize: none; 
            word-break: break-all; 
            margin-top: 5px; 
            padding: 10px; 
            box-sizing: border-box; 
            border-radius: 4px; 
            font-family: monospace; 
        }
        .step-box { 
            background: #161616; 
            padding: 15px; 
            border-radius: 4px; 
            border: 1px dashed #444; 
            margin-bottom: 20px; 
            text-align: left; 
            font-size: 13px; 
            line-height: 1.6; 
        }
        code { 
            background: #000; 
            color: #ff4655; 
            padding: 2px 6px; 
            border-radius: 3px; 
            font-family: monospace; 
            font-size: 12px; 
        }
        ol { padding-left: 18px; margin: 8px 0; }
        li { margin-bottom: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Zenith URL Assistant</h1>
    <div class="subtitle">🛡️ 全新自動穿透版！免手動切換視環境 [v2.0]</div>
    
    <div class="step-box">
        <strong style="color: #ff4655;">💡 提取商店網址步驟：</strong><br>
        <ol>
            <li>先點擊前往 <a href="https://playvalorant.com/zh-tw/" target="_blank" style="color: #00ffcc; font-weight: bold; text-decoration: none;">【特戰英豪官方網站】</a> 並確保右上角是已登入狀態。</li>
            <li>在官方網頁按下 <code>F12</code> 切換到 <strong>Console (主控台)</strong> 分頁。</li>
            <li>點擊下方按鈕複製代碼，直接貼進 Console 並按下 <code>Enter</code> 執行：</li>
        </ol>
        <button class="btn" onclick="copyConsoleCode()">📋 一鍵複製全新自動穿透代碼</button>
    </div>

    <div class="input-group">
        <label>步驟三：將剛才自動複製到的「長串 Token 網址」貼在下方：</label>
        <input type="text" id="rawToken" placeholder="Ctrl + V 貼上提取結果..." oninput="processToken()">
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-title">🎉 成功生成專屬商店網址！</div>
        <textarea id="outputUrl" readonly></textarea>
        <button class="submit-btn" onclick="copyResult()">一鍵複製網址（回 Discord 貼上）</button>
    </div>
</div>

<script>
function copyConsoleCode() {
    // 終極穿透代碼：無關當前選擇哪一個 iframe，直接藉由同源重定向抓取隱藏數據
    const code = `(() => {
        console.clear();
        console.log("%c正在啟動全自動地毯式 Token 穿透程序...", "color: #ff4655; font-weight: bold;");
        
        let targetUrl = "https://auth.riotgames.com/api/v1/authorization?client_id=play-valorant-web-prod&response_type=token%20id_token&redirect_uri=https%3A%2F%2Fplayvalorant.com%2Fopt_in&scope=openid%20link%20ban&nonce=1";
        
        // 建立隱藏的跳轉錨點，避開當前 Console 環境的 iframe 隔離
        let a = document.createElement('a');
        a.href = targetUrl;
        a.target = '_self'; 
        
        console.log("%c正在將授權端點快照快取至您的當前瀏覽器...", "color: #00ffcc;");
        
        // 提示群友
        setTimeout(() => {
            let currentHref = window.location.href;
            if(currentHref.includes("access_token=")) {
                copy(currentHref);
                console.log("%c🎉 【核心穿透成功】Token 網址已自動複製到剪貼簿！請回助手網頁貼上！", "color: #00ffcc; font-weight: bold; font-size: 14px;");
            } else {
                // 如果在 top 層，主動引導重定向提取
                window.location.href = targetUrl;
            }
        }, 500);
    })()`;

    navigator.clipboard.writeText(code).then(() => {
        alert('📋 穿透腳本已複製！請前往特戰官網按 F12 貼上並 Enter。\n\n網頁如果變白或跳轉是正常現象，腳本會自動把抓到的結果寫入剪貼簿！');
    });
}

function processToken() {
    const input = document.getElementById('rawToken').value.trim();
    const resultBox = document.getElementById('resultBox');
    const outputUrl = document.getElementById('outputUrl');
    
    if (input.length > 30) {
        if (input.includes('access_token=')) {
            // 如果群友直接把整條跳轉後的網址貼進來，直接幫他格式化
            let tokenPart = input.split('#')[1] || input.split('?')[1] || input;
            outputUrl.value = "https://playvalorant.com/zh-tw/opt_in/#" + tokenPart;
        } else {
            outputUrl.value = "https://playvalorant.com/zh-tw/opt_in/#access_token=" + input;
        }
        resultBox.style.display = "block";
    } else {
        resultBox.style.display = "none";
    }
}

function copyResult() {
    let t = document.getElementById('outputUrl');
    t.select();
    document.execCommand('copy');
    alert('🎉 商店網址已成功複製！快回 Discord 分享或給機器人查詢吧！');
    document.getElementById('rawToken').value = '';
    document.getElementById('resultBox').style.display = 'none';
}
</script>
</body>
</html>
