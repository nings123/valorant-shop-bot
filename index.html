<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Token 獲取助手</title>
    <style>
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 40px 30px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
        .subtitle { color: #888888; font-size: 13px; margin-bottom: 30px; letter-spacing: 1px; }
        .step-card {
            background-color: #161616;
            border: 1px solid #1c1c1c;
            padding: 20px;
            text-align: left;
            margin-bottom: 20px;
            border-radius: 2px;
        }
        .step-num { font-size: 12px; color: #ff4655; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; display: block; letter-spacing: 1px; }
        .step-text { color: #cccccc; font-size: 14px; line-height: 1.6; }
        
        .drag-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: #ff4655;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1px;
            border-radius: 4px;
            box-sizing: border-box;
            border: 2px dashed #ffffff;
            cursor: move;
            text-transform: uppercase;
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 0 15px rgba(255, 70, 85, 0.4);
            transition: transform 0.2s;
        }
        .drag-btn:hover {
            transform: scale(1.02);
            background-color: #e33e4d;
        }
        .btn-secondary {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #1c1c1c;
            color: #888888;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid #2c2c2c;
            border-radius: 2px;
            box-sizing: border-box;
            text-align: center;
        }
        .btn-secondary:hover { border-color: #ffffff; color: #ffffff; }
        code { background: #000000; padding: 3px 6px; border-radius: 2px; color: #ff4655; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Zenith Token Assistant</h1>
    <div class="subtitle">特戰每日商店查詢金鑰安全獲取工具</div>
    
    <div class="step-card">
        <span class="step-num">Step 01</span>
        <div class="step-text">
            請按下鍵盤 <code>Ctrl + Shift + B</code> 顯示瀏覽器的「書籤列」。
        </div>
    </div>

    <div class="step-card">
        <span class="step-num">Step 02</span>
        <div class="step-text">
            用滑鼠按住下方<b>紅色虛線按鈕</b>，直接【<b>拖曳到書籤列</b>】放開（請記得把舊的移除掉喔！）。
        </div>
        
        <a class="drag-btn" href="javascript:(function(){const host=window.location.hostname;const hash=window.location.hash;if(host==='playvalorant.com'&&hash.includes('access_token')){const el=document.createElement('textarea');el.value=window.location.href;document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);alert('🎉 獲取成功！\n\n網址金鑰已安全複製到您的剪貼簿！\n現在可以立刻回到 Discord 貼上查詢囉！');}else if(host!=='playvalorant.com'){alert('❌ 請先前往特戰英豪官網分頁！\n\n點擊確定後將自動幫您開啟正確網頁，到該網頁後再點一次這個書籤即可！');window.open('https://playvalorant.com/zh-tw/','_blank');}else{window.location.assign('https://auth.riotgames.com/authorize?client_id=play-valorant-web-prod&response_type=token+id_token&redirect_uri=https%3A%2F%2Fplayvalorant.com%2Fopt_in&scope=openid+link+ban&nonce=1');}})();">
            ➔ 拖曳我到書籤列 ➔
        </a>
        
        <a href="https://account.riotgames.com/" target="_blank" class="btn-secondary">點我前往 Riot 官方登入中心</a>
    </div>

    <div class="step-card" style="margin-bottom: 0;">
        <span class="step-num">Step 03</span>
        <div class="step-text">
            登入後在<b>特戰官網分頁</b>點一下這個書籤，網頁會跳轉出長網址並彈出「獲取成功」，這時候直接去 Discord 貼上就完成了！
        </div>
    </div>
</div>

</body>
</html>
