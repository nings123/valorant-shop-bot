<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Token 獲取助手</title>
    <style>
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 40px 30px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
        .subtitle { color: #888888; font-size: 13px; margin-bottom: 30px; letter-spacing: 1px; }
        .step-card {
            background-color: #161616;
            border: 1px solid #1c1c1c;
            padding: 20px;
            text-align: left;
            margin-bottom: 20px;
            border-radius: 2px;
        }
        .step-num { font-size: 12px; color: #ff4655; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; display: block; letter-spacing: 1px; }
        .step-text { color: #cccccc; font-size: 14px; line-height: 1.6; }
        
        .drag-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: #ff4655;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1px;
            border-radius: 4px;
            box-sizing: border-box;
            border: 2px dashed #ffffff;
            cursor: move;
            text-transform: uppercase;
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 0 15px rgba(255, 70, 85, 0.4);
            transition: transform 0.2s;
        }
        .drag-btn:hover {
            transform: scale(1.02);
            background-color: #e33e4d;
        }
        code { background: #000000; padding: 3px 6px; border-radius: 2px; color: #ff4655; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Zenith Token Assistant</h1>
    <div class="subtitle">特戰每日商店查詢金鑰安全獲取工具</div>
    
    <div class="step-card">
        <span class="step-num">Step 01</span>
        <div class="step-text">
            請按下鍵盤 <code>Ctrl + Shift + B</code> 顯示瀏覽器的「書籤列」。
        </div>
    </div>

    <div class="step-card">
        <span class="step-num">Step 02</span>
        <div class="step-text">
            把舊的 Zenith 書籤按右鍵刪除，然後把下方<b>紅色虛線按鈕</b>重新【<b>拖曳到書籤列</b>】。
        </div>
        
        <a class="drag-btn" href="javascript:(function(){const hash=window.location.hash;if(hash.includes('access_token')){let params=new URLSearchParams(hash.replace('#','?'));let token=params.get('access_token');let cleanUrl='https://playvalorant.com/opt_in/#access_token='+token;const el=document.createElement('textarea');el.value=cleanUrl;document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);alert('🎉 獲取成功！\n\n網址已完成「極致防吃字縮減」並去除了 zh-tw！\n現在貼進 Discord 絕對不會再被砍斷囉！');}else{window.location.assign('https://auth.riotgames.com/authorize?client_id=play-valorant-web-prod&response_type=token+id_token&redirect_uri=https%3A%2F%2Fplayvalorant.com%2Fopt_in&scope=openid+link+ban&nonce=1');}})();">
            ➔ 拖曳我到書籤列 ➔
        </a>
    </div>

    <div class="step-card" style="margin-bottom: 0;">
        <span class="step-num">Step 03</span>
        <div class="step-text">
            點擊書籤後，網頁會自動跳轉。當畫面上彈出「獲取成功」時，直接去 Discord 貼上就大功告成了！
        </div>
    </div>
</div>

</body>
</html>
