<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith 特戰網址提取助手 v3.0</title>
    <style>
        body { 
            font-family: "Segoe UI", Arial, sans-serif; 
            background-color: #0b0b0b; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .container { 
            background-color: #111111; 
            border: 1px solid #222222; 
            padding: 35px 25px; 
            border-radius: 4px; 
            max-width: 500px; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
        }
        h1 { 
            font-size: 22px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            margin-bottom: 8px; 
            color: #ff4655; 
        }
        .subtitle { 
            color: #aaaaaa; 
            font-size: 13px; 
            margin-bottom: 25px; 
        }
        .input-group { 
            text-align: left; 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            font-size: 13px; 
            color: #cccccc; 
            margin-bottom: 8px; 
            font-weight: 600; 
            line-height: 1.5; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            background-color: #161616; 
            border: 1px solid #333; 
            color: #fff; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 13px; 
        }
        input:focus { 
            border-color: #ff4655; 
            outline: none; 
        }
        .submit-btn { 
            display: block; 
            width: 100%; 
            padding: 12px 0; 
            background-color: #ff4655; 
            color: #fff; 
            font-weight: 700; 
            font-size: 15px; 
            border-radius: 4px; 
            cursor: pointer; 
            border: none; 
            margin-top: 15px; 
        }
        .submit-btn:hover { 
            background-color: #dc3d4b; 
        }
        .result-box { 
            margin-top: 20px; 
            background: #000; 
            padding: 15px; 
            border-radius: 4px; 
            display: none; 
            text-align: left; 
            border: 1px solid #222; 
        }
        .result-title { 
            color: #00ffcc; 
            font-size: 13px; 
            font-weight: bold; 
            margin-bottom: 5px; 
        }
        textarea { 
            width: 100%; 
            height: 80px; 
            background: #111; 
            border: 1px solid #222; 
            color: #00ffcc; 
            font-size: 12px; 
            resize: none; 
            word-break: break-all; 
            margin-top: 5px; 
            padding: 10px; 
            box-sizing: border-box; 
            border-radius: 4px; 
            font-family: monospace; 
        }
        .step-box { 
            background: #161616; 
            padding: 15px; 
            border-radius: 4px; 
            border: 1px dashed #444; 
            margin-bottom: 20px; 
            text-align: left; 
            font-size: 13px; 
            line-height: 1.6; 
        }
        ol { padding-left: 18px; margin: 8px 0; }
        li { margin-bottom: 8px; }
        .highlight { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Zenith URL Assistant</h1>
    <div class="subtitle">🛡️ 終極無腦版｜100% 成功提取（支援手機 / 免開 F12）</div>
    
    <div class="step-box">
        <strong style="color: #ff4655;">💡 超簡單獲取二步驟：</strong><br>
        <ol>
            <li>請先點擊右側連結完成登入：<a href="https://auth.riotgames.com/authorize?client_id=play-valorant-web-prod&response_type=token%20id_token&redirect_uri=https%3A%2F%2Fplayvalorant.com%2Fopt_in&scope=openid%20link%20ban&nonce=1" target="_blank" style="color: #ff4655; font-weight: bold; text-decoration: underline;">【點我前往官方授權驗證】</a></li>
            <li>登入完後，網頁會跳轉到官方的空白 404 頁面，這時請直接<span class="highlight">複製瀏覽器最上方「整條網址」</span>（內含 access_token）。</li>
        </ol>
    </div>

    <div class="input-group">
        <label>步驟三：將複製到的「整條 404 長網址」直接貼在下方：</label>
        <input type="text" id="rawToken" placeholder="https://playvalorant.com/zh-tw/404/#access_token=..." oninput="processToken()">
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-title">🎉 成功過濾並生成商店查詢網址！</div>
        <textarea id="outputUrl" readonly></textarea>
        <button class="submit-btn" onclick="copyResult()">一鍵複製網址（回 Discord 貼上）</button>
    </div>
</div>

<script>
function processToken() {
    const input = document.getElementById('rawToken').value.trim();
    const resultBox = document.getElementById('resultBox');
    const outputUrl = document.getElementById('outputUrl');
    
    if (input.length > 30) {
        // 不管群友貼的是完整網址還是截斷後的片段，自動辨識並封裝成標準商店格式
        if (input.includes('access_token=')) {
            let tokenPart = input.split('#')[1] || input.split('?')[1] || input;
            outputUrl.value = "https://playvalorant.com/zh-tw/opt_in/#" + tokenPart;
            resultBox.style.display = "block";
        } else if (input.startsWith('eyJ')) { 
            // 如果群友只貼了 Token 本身
            outputUrl.value = "https://playvalorant.com/zh-tw/opt_in/#access_token=" + input;
            resultBox.style.display = "block";
        } else {
            resultBox.style.display = "none";
        }
    } else {
        resultBox.style.display = "none";
    }
}

function copyResult() {
    let t = document.getElementById('outputUrl');
    t.select();
    document.execCommand('copy');
    alert('🎉 商店網址已成功複製！快回 Discord 分享或給機器人查詢吧！');
    document.getElementById('rawToken').value = '';
    document.getElementById('resultBox').style.display = 'none';
}
</script>
</body>
</html>
