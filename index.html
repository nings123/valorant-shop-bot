<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Token 獲取助手</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #161a23;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #ffffff; }
        p { color: #a0aab8; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: #ff4655;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #e53e4b; }
        .btn-secondary { background-color: #2b313d; color: #a0aab8; }
        .btn-secondary:hover { background-color: #363e4d; color: #ffffff; }
        .result-box {
            background-color: #0b0e14;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            margin-top: 20px;
            display: none;
            border: 1px solid #2b313d;
        }
        .result-box label { font-size: 12px; color: #ff4655; font-weight: bold; display: block; margin-bottom: 5px; }
        .result-box textarea {
            width: 100%;
            height: 60px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            outline: none;
            padding: 0;
        }
        .step { text-align: left; background: #1f2530; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .step-title { font-weight: bold; margin-bottom: 5px; color: #ffffff; font-size: 15px; }
        .step-desc { color: #a0aab8; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Zenith Token 獲取助手</h1>
    <p>為了帳號安全，本工具不索取帳密。請按照下方步驟獲取商店查詢金鑰。</p>
    
    <div class="step">
        <div class="step-title">1️⃣ 第一步：登入官網</div>
        <div class="step-desc">請先點擊下方按鈕登入 Riot 官方網站（若已登入可跳過）。</div>
    </div>
    <a href="https://account.riotgames.com/" target="_blank" class="btn btn-secondary">👉 前往 Riot 官方登入</a>

    <div class="step">
        <div class="step-title">2️⃣ 第二步：授權並複製網址</div>
        <div class="step-desc">登入後回來點擊下方按鈕。會開啟一個微軟空白網頁，請<b>複製該網頁最上方的「整條長網址」</b>。</div>
    </div>
    <a href="https://auth.riotgames.com/authorize?client_id=play-valorant-web-prod&response_type=token+id_token&redirect_uri=https%3A%2F%2Flogin.live.com%2Foauth20_desktop.srf&scope=openid+link+ban&nonce=1" target="_blank" class="btn">🔗 點我獲取授權網址</a>

    <div class="step">
        <div class="step-title">3️⃣ 第三步：回到 Discord 查詢</div>
        <div class="step-desc">回到 Discord 輸入 <code>/shop</code>，並把複製的長網址直接貼進 <code>access_token</code> 欄位即可！</div>
    </div>

    <div class="result-box" id="resultBox">
        <label>✨ 偵測到複製網址！請將下方內容完整複製貼回 Discord：</label>
        <textarea id="outputUrl" readonly></textarea>
    </div>
</div>

<script>
    // 自動辨識貼入網址的超貼心小功能
    window.addEventListener('hashchange', checkUrl);
    window.addEventListener('load', checkUrl);

    function checkUrl() {
        if (window.location.hash || window.location.search) {
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('outputUrl').value = window.location.href;
        }
    }
</script>

</body>
</html>
