<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith 特戰網址過濾助手</title>
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; background-color: #0b0b0b; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: #111111; border: 1px solid #222222; padding: 35px 25px; border-radius: 4px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; color: #ff4655; }
        .subtitle { color: #888888; font-size: 13px; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #aaaaaa; margin-bottom: 8px; font-weight: 600; line-height: 1.5; }
        input { width: 100%; padding: 12px; background-color: #161616; border: 1px solid #333; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        input:focus { border-color: #ff4655; outline: none; }
        .btn { display: block; width: 100%; padding: 12px 0; background-color: #ff4655; color: #ffffff; font-weight: 700; font-size: 15px; border-radius: 4px; cursor: pointer; border: none; margin-top: 20px; }
        .btn:hover { background-color: #dc3d4b; }
        .result-box { margin-top: 20px; background: #000; padding: 15px; border-radius: 4px; display: none; text-align: left; border: 1px solid #222; }
        .result-title { color: #ff4655; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        textarea { width: 100%; height: 80px; background: #111; border: 1px solid #222; color: #00ffcc; font-size: 11px; resize: none; word-break: break-all; margin-top: 5px; padding: 10px; box-sizing: border-box; border-radius: 4px; font-family: monospace; }
        .step-box { background: #161616; padding: 15px; border-radius: 4px; border: 1px dashed #444; margin-bottom: 20px; text-align: left; }
        .step-link { display: inline-block; color: #ff4655; text-decoration: none; font-weight: bold; margin-top: 8px; font-size: 14px; }
        .step-link:hover { text-decoration: underline; color: #dc3d4b; }
    </style>
</head>
<body>

<div class="container">
    <h1>Zenith URL Assistant</h1>
    <div class="subtitle">100% 安全防封鎖！一鍵提取專屬商店網址</div>
    
    <div id="converterForm">
        <div class="step-box">
            <span style="font-size: 13px; color: #ff4655; font-weight: bold;">步驟一：獲取官方合法登入憑證</span><br>
            <p style="font-size: 11px; color: #aaa; margin: 5px 0 10px 0; line-height: 1.4;">
                1. 請先點擊 <a href="https://playvalorant.com/zh-tw/" target="_blank" style="color: #00ffcc; font-weight: bold; text-decoration: none;">【進入特戰官方主站】</a> 並在右上角完成您的帳號登入。<br>
                2. 登入成功後回到這裡，點擊 <a href="https://auth.riotgames.com/authorize?client_id=play-valorant-web-prod&response_type=token%20id_token&redirect_uri=https%3A%2F%2Fplayvalorant.com%2Fopt_in&scope=openid%20link%20ban" target="_blank" style="color: #00ffcc; font-weight: bold; text-decoration: none;">【提取專屬商店連結】</a>，網頁會秒變空白並產生長網址。
            </p>
        </div>

        <div class="input-group">
            <label>步驟二：登入後網頁會變空白，請複製瀏覽器最上方「整條長網址」貼在下方：</label>
            <input type="text" id="riotUrl" placeholder="https://playvalorant.com/opt_in/#access_token=..." oninput="convertUrl()">
        </div>
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-title">🎉 成功提取網址！請複製下方內容貼回 Discord 查商店：</div>
        <textarea id="outputUrl" readonly></textarea>
        <button class="btn" onclick="copyResult()">一鍵複製商店網址</button>
    </div>
</div>

<script>
function convertUrl() {
    const input = document.getElementById('riotUrl').value.trim();
    const resultBox = document.getElementById('resultBox');
    const outputUrl = document.getElementById('outputUrl');
    
    let match = input.match(/access_token=([^&]+)/);
    if (match) {
        outputUrl.value = "https://playvalorant.com/zh-tw/opt_in/#access_token=" + match[1];
        resultBox.style.display = "block";
    } else {
        resultBox.style.display = "none";
    }
}

function copyResult() {
    let t = document.getElementById('outputUrl');
    t.select();
    document.execCommand('copy');
    alert('🎉 複製成功！快回 Discord 貼上吧！');
    // 自動清空輸入，方便下一次使用
    document.getElementById('riotUrl').value = '';
    document.getElementById('resultBox').style.display = 'none';
}
</script>
</body>
</html>
