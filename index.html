<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Token 獲取助手</title>
    <style>
        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 40px 30px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; color: #ffffff; text-transform: uppercase; }
        .subtitle { color: #888888; font-size: 13px; margin-bottom: 30px; letter-spacing: 1px; }
        .step-card {
            background-color: #161616;
            border: 1px solid #1c1c1c;
            padding: 20px;
            text-align: left;
            margin-bottom: 20px;
            border-radius: 2px;
        }
        .step-num { font-size: 12px; color: #ff4655; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; display: block; letter-spacing: 1px; }
        .step-text { color: #cccccc; font-size: 14px; line-height: 1.6; }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            border-radius: 2px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn:hover { background-color: #ff4655; color: #ffffff; }
        .btn-secondary { background-color: #1c1c1c; color: #888888; border: 1px solid #2c2c2c; margin-bottom: 15px; }
        .btn-secondary:hover { border-color: #ffffff; color: #ffffff; background-color: #1c1c1c; }
        code { background: #000000; padding: 3px 6px; border-radius: 2px; color: #ff4655; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Zenith Token Assistant</h1>
    <div class="subtitle">特戰每日商店查詢金鑰安全獲取工具</div>
    
    <div class="step-card">
        <span class="step-num">Step 01</span>
        <div class="step-text">請先點擊下方按鈕登入 Riot 官方網站（若瀏覽器已登入過可直接跳過）。</div>
    </div>
    <a href="https://account.riotgames.com/" target="_blank" class="btn btn-secondary">前往 Riot 官方登入中心</a>

    <div class="step-card">
        <span class="step-num">Step 02</span>
        <div class="step-text">點擊下方按鈕下載金鑰獲取腳本。下載後<b>直接雙擊執行</b>，它會自動為您在瀏覽器抓取安全金鑰，並直接跳出視窗讓您一鍵複製網址！</div>
    </div>
    <button onclick="downloadScript()" class="btn">下載一鍵獲取腳本</button>

    <div class="step-card" style="margin-top: 25px; margin-bottom: 0;">
        <span class="step-num">Step 03</span>
        <div class="step-text">回到 Discord 輸入 <code>/shop</code>，並將複製的整條網址直接貼進 <code>access_token</code> 欄位即可秒出商店！</div>
    </div>
</div>

<script>
    function downloadScript() {
        // 利用 PowerShell 官方原生快取通道，在使用者本地端完全無痛抓取 Token
        const scriptText = `@echo off\nchcp 65001 >nul\ntitle Zenith Token Grabber\necho 🚀 正在安全獲取您的特戰商店 Token...\npowershell -Command "$url = 'https://auth.riotgames.com/authorize?client_id=play-valorant-web-prod&response_type=token+id_token&redirect_uri=https%3A%2F%2Fplayvalorant.com%2Fopt_in&scope=openid+link+ban&nonce=1'; $ie = New-Object -ComObject InternetExplorer.Application; $ie.Navigate($url); while($ie.Busy -or $ie.ReadyState -ne 4){Start-Sleep -m 100}; $finalUrl = $ie.LocationURL; $ie.Quit(); if($finalUrl -match 'access_token='){ Add-Type -AssemblyName System.Windows.Forms; [System.Windows.Forms.Clipboard]::SetText($finalUrl); [System.Windows.Forms.MessageBox]::Show('🎉 成功獲取安全金鑰！\\n\\n網址已自動複製到您的剪貼簿！\\n請立刻回到 Discord 貼上查詢吧！', 'Zenith 助手'); } else { [System.Windows.Forms.MessageBox]::Show('❌ 獲取失敗！請確認您是否已經先在網頁登入 Riot 帳號。', 'Zenith 錯誤'); }"\nexit`;
        
        const blob = new Blob([scriptText], { type: 'text/plain' });
        const element = document.createElement('a');
        element.href = URL.createObjectURL(blob);
        element.download = "Get_Zenith_Token.bat";
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
    }
</script>

</body>
</html>
